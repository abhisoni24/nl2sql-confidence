# Dr.Spider NLQ perturbation sets (Chang et al., ICLR 2023).
# Each set has index-aligned pre/post question files whose gold SQL is identical.
data:
  name: drspider_nlq
  source_url: https://media.githubusercontent.com/media/awslabs/diagnostic-robustness-text-to-sql/main/data.tar.gz
  sha256: d0f47e4d2c9202f4fd2d956a34e9dd1ff8180c1c9e58cf5b530c13fefaaa3ba9
  archive_name: drspider_data.tar.gz     # stored under paths.raw_dir
  extract_dir: drspider                  # extracted under paths.raw_dir
  db_subdir: Spider-dev/databases        # NLQ sets reuse the Spider-dev SQLite files

  # Which perturbation sets to use and how many pairs to sample from each.
  perturbation_sets:
    - NLQ_keyword_synonym
    - NLQ_column_synonym
    - NLQ_value_synonym
  pairs_per_set: 100                     # null = use every eligible pair
  one_pair_per_question: true            # a clean question can have several rewrites;
                                         # keep at most one so pairs are independent
