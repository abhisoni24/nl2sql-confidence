[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-conf"
version = "0.1.0"
description = "Does a text-to-SQL model's confidence track perturbation-induced failures? (ECE/CS 559)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
